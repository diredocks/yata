name: yata
description: "Yet Another Todo App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  dynamic_color: ^2.1.0
  intl: any
  lottie: ^3.8.2
  audioplayers: ^6.8.1
  http: ^1.2.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/
    - assets/themes/
